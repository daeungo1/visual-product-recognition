[project]
name = "visual-guide-demo-api"
version = "0.1.0"
description = "Visual guide API with separate local demo and authenticated Azure adapters"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.12,<0.116",
    "uvicorn[standard]>=0.34.2,<0.35",
    "gunicorn>=23.0.0,<24; sys_platform != 'win32'",
    "uvicorn-worker>=0.3.0,<0.4; sys_platform != 'win32'",
    "pillow>=11.3,<13",
]

[project.optional-dependencies]
cloud = [
    "azure-identity>=1.24,<2",
    "azure-cosmos>=4.9,<5",
    "azure-storage-blob>=12.26,<13",
    "azure-search-documents>=11.6,<12",
    "openai>=1.109,<3",
]
inference = [
    "torch==2.8.0",
    "transformers>=4.49,<5",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1,<0.29",
    "pytest>=8.3.5,<9",
    "ruff>=0.11.8,<0.12",
    "ipykernel>=6.29.5,<7",
    "ipywidgets>=8.1.6,<9",
    "tqdm>=4.67.1,<5",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/guide_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --basetemp=.test-data"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
