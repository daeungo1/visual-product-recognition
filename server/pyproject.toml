[project]
name = "visual-product-guide-api"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "anyio>=4.8,<4.15",
    "azure-identity>=1.25,<2",
    "fastapi>=0.118,<0.119",
    "openai>=2.7,<3",
    "pillow>=12,<13",
    "pydantic>=2.12,<3",
    "uvicorn[standard]>=0.38,<0.39",
]

[dependency-groups]
dev = [
    "httpx>=0.28,<0.29",
    "ipykernel>=7,<8",
    "ipywidgets>=8,<9",
    "pytest>=9,<10",
    "ruff>=0.14,<0.15",
    "tqdm>=4.67,<5",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/visual_guide"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --basetemp=.test-data"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"src/visual_guide/demo.py" = ["E501"]
