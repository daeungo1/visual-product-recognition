<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Foundry 영역 제안 로컬 DEMO</title>
<style>
body{font-family:system-ui,sans-serif;margin:16px;max-width:760px}
.stage{position:relative;display:inline-block;max-width:100%}
.stage img{max-width:100%;display:block}
.box{position:absolute;border:3px solid #f5c400;box-sizing:border-box}
.dot{position:absolute;width:14px;height:14px;margin:-7px;border-radius:50%;background:#e53935}
.tag{position:absolute;background:#f5c400;color:#000;font-size:12px;padding:1px 4px;top:-18px;left:-3px}
.warn{background:#fff3cd;padding:8px;border-radius:6px}
</style>
</head>
<body>
<h1>Foundry 영역 제안 로컬 DEMO</h1>
<p class="warn">로컬 PC 전용 목업이다. 모델 제안은 사람 검수 전 초안이며 실제 제품 인식·정확도를 뜻하지 않는다.
이미지는 저장하지 않고 모델 호출 1회에만 쓰인다.</p>
<form id="f">
<p><input type="file" id="img" accept="image/png,image/jpeg" required></p>
<p><label>부품 이름(쉼표로 구분)<br>
<input id="names" size="50" value="power button, temperature display, air vent"></label></p>
<button>영역 제안 요청</button>
</form>
<p id="status" role="status"></p>
<div class="stage" id="stage"></div>
<script>
const f = document.getElementById("f");
const status = document.getElementById("status");
const stage = document.getElementById("stage");
f.addEventListener("submit", async (event) => {
  event.preventDefault();
  const file = document.getElementById("img").files[0];
  status.textContent = "모델 호출 중...";
  stage.replaceChildren();
  const query = new URLSearchParams({components: document.getElementById("names").value});
  const reply = await fetch("/propose?" + query, {method: "POST", body: file});
  const data = await reply.json();
  if (!reply.ok) { status.textContent = "실패: " + (data.detail || reply.status); return; }
  const img = new Image();
  img.src = URL.createObjectURL(file);
  await img.decode();
  stage.append(img);
  for (const r of data.regions) {
    const [x1, y1, x2, y2] = r.box;
    const box = document.createElement("div");
    box.className = "box";
    Object.assign(box.style, {left: x1*100+"%", top: y1*100+"%",
      width: (x2-x1)*100+"%", height: (y2-y1)*100+"%"});
    const tag = document.createElement("span");
    tag.className = "tag";
    tag.textContent = r.component;
    box.append(tag);
    const dot = document.createElement("div");
    dot.className = "dot";
    Object.assign(dot.style, {left: r.point[0]*100+"%", top: r.point[1]*100+"%"});
    stage.append(box, dot);
  }
  status.textContent = `${data.model}: ${data.regions.length}개 초안 영역` +
    (data.missing.length ? `, 미확인: ${data.missing.join(", ")}` : "") + " (검수 필요)";
});
</script>
</body>
</html>
