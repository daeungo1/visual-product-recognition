name: Publish Azure mobile web demo

on:
  push:
    branches: [main]
    paths:
      - assets/**
      - pipeline/stage_web.py
      - .github/workflows/static-web.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: azure-static-mobile-demo
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Stage only public demo content
        run: python pipeline/stage_web.py --output _site
      - name: Publish static files without API or build
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: _site
          api_location: ""
          output_location: ""
          skip_app_build: true
