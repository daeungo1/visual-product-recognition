name: Publish mock-up target

on:
  push:
    branches: [main]
    paths:
      - assets/**
      - pipeline/stage_web.py
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  target:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - name: Stage demo pages and synthetic targets
        run: python pipeline/stage_web.py --output _site --entry product-demo.html
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy target
        id: deployment
        uses: actions/deploy-pages@v4
